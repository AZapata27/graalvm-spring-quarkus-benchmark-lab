name: Native image

# GraalVM native compilation is slow, so it is run on demand only and is not a required check.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.project }} (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: quarkus-native
            task: build -x test -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
          - project: quarkus-reactive-native
            task: build -x test -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
          - project: spring-native
            task: nativeCompile
          - project: spring-webflux-native
            task: nativeCompile
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM for JDK 21
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '21'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: gradle

      - name: Compile native image
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: |
          set -f   # word-split GRADLE_TASK into arguments without glob expansion
          # shellcheck disable=SC2086
          ./gradlew ${GRADLE_TASK} --no-daemon
