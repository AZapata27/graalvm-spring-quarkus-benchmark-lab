# Test configuration: in-memory H2 instead of PostgreSQL so the suite runs without external services.
spring.application.name=spring-graalvm
spring.datasource.url=jdbc:h2:mem:carts;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# schema.sql / data.sql target PostgreSQL; Hibernate creates the schema from the entities instead.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
