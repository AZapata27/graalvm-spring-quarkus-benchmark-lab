# Test configuration: in-memory H2 instead of PostgreSQL so the suite runs without external services.
spring.application.name=spring-webflux-native
# R2DBC and Flyway (JDBC) point to the same named in-memory H2 database; PostgreSQL mode lets the
# production migrations in db/migration run unchanged.
spring.r2dbc.url=r2dbc:h2:mem:///carts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.flyway.url=jdbc:h2:mem:carts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.flyway.user=sa
spring.flyway.password=
