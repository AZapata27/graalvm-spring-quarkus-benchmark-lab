# Test configuration: in-memory H2 (R2DBC) instead of PostgreSQL so the suite runs without external services.
spring.application.name=spring-webflux-native
spring.r2dbc.url=r2dbc:h2:mem:///carts;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.flyway.enabled=false
# The production scripts target PostgreSQL; tests use an H2-compatible schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
