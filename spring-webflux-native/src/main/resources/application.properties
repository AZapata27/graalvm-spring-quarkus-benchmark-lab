spring.application.name=spring-webflux-native

# R2DBC (acceso reactivo de la aplicacion) contra PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/mydatabase
spring.r2dbc.username=myuser
spring.r2dbc.password=secret

# Flyway no habla R2DBC: migra por JDBC contra la misma base. Con spring.flyway.url Spring Boot
# auto-configura Flyway aunque no exista un DataSource (la app solo expone un ConnectionFactory R2DBC).
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/mydatabase
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
