name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # weekly run, mainly for CodeQL (security job)

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.project }} (JVM)
    strategy:
      fail-fast: false
      matrix:
        project:
          - quarkus-native
          - quarkus-reactive-native
          - spring-native
          - spring-webflux-native
    uses: AZapata27/reusable-workflows/.github/workflows/java-gradle.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
    with:
      java-version: '21'
      working-directory: ${{ matrix.project }}
      gradle-args: build --no-daemon
      timeout-minutes: 30
      report-name: test-reports-${{ matrix.project }}

  workflow-lint:
    uses: AZapata27/reusable-workflows/.github/workflows/workflow-lint.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read

  security:
    uses: AZapata27/reusable-workflows/.github/workflows/security.yml@1f72ba8c03929704ea446e9df6a80ceb23675d51 # v1.0.1
    permissions:
      contents: read
      actions: read            # CodeQL (required even when skipped; see reusable-workflows ADR 0003)
      security-events: write   # CodeQL SARIF upload
    with:
      codeql-languages: '["java-kotlin", "actions"]'
      codeql-build-mode: none  # Java/Kotlin analysed without building the four Gradle projects
